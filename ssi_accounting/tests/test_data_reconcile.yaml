options:
  auto_refresh: true

scenarios:
  - name: "Two opposite lines on a reconcilable account fully match"
    steps:
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Reconcile Journal 1"
          type: "general"
      - step: "Create a reconcilable (receivable) account"
        action: "create"
        model: "account.account"
        save_as: "acc_ar"
        values:
          name: "Receivable 1"
          account_type: "asset_receivable"
          code: "REC1AR"
      - step: "Create the contra income account"
        action: "create"
        model: "account.account"
        save_as: "acc_income"
        values:
          name: "Income 1"
          account_type: "income"
          code: "REC1INC"
      - step: "Create and post the debit-side entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry1"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-01
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_ar.id"
                debit: 500.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 0.0
                credit: 500.0
      - step: "Post the debit-side entry"
        action: "call"
        target: "entry1"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Create and post the credit-side entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry2"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-02
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_ar.id"
                debit: 0.0
                credit: 500.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 500.0
                credit: 0.0
      - step: "Post the credit-side entry"
        action: "call"
        target: "entry2"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Find the debit-side receivable line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry1.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "line1"
        limit: 1
      - step: "Find the credit-side receivable line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry2.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "line2"
        limit: 1
      - step: "Find both receivable lines as one recordset"
        action: "search"
        model: "journal_entry.item"
        domain: [["id", "in", ["REC: line1.id", "REC: line2.id"]]]
        save_as: "ar_lines"
        expect_count: 2
      - step: "Reconcile them"
        action: "call"
        target: "ar_lines"
        method: "reconcile"
        as_user: "base.user_admin"
      - step: "Assert the debit-side line is fully reconciled"
        action: "assert"
        target: "line1"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: true
          amount_residual:
            type: "value"
            expected: 0.0
      - step: "Assert the credit-side line is fully reconciled"
        action: "assert"
        target: "line2"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: true
          amount_residual:
            type: "value"
            expected: 0.0
      - step: "Exactly one reconcile_partial was created"
        action: "search"
        model: "reconcile_partial"
        domain:
          [
            ["debit_move_id", "=", "REC: line1.id"],
            ["credit_move_id", "=", "REC: line2.id"],
          ]
        save_as: "partial"
        expect_count: 1
      - step: "Assert the partial's amount"
        action: "assert"
        target: "partial"
        asserts:
          amount:
            type: "value"
            expected: 500.0
      - step: "Exactly one reconcile_full was created"
        action: "search"
        model: "reconcile_full"
        domain: [["reconciled_line_ids", "in", ["REC: line1.id", "REC: line2.id"]]]
        save_as: "full"
        expect_count: 1
      - step: "Neither line keeps a partial-style 'P' matching number"
        action: "search"
        model: "journal_entry.item"
        domain:
          [
            ["id", "in", ["REC: line1.id", "REC: line2.id"]],
            ["matching_number", "like", "P%"],
          ]
        save_as: "no_p_lines"
        expect_count: 0

  - name: "Partial reconciliation leaves a residual and a 'P' matching number"
    steps:
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Reconcile Journal 2"
          type: "general"
      - step: "Create a reconcilable (receivable) account"
        action: "create"
        model: "account.account"
        save_as: "acc_ar"
        values:
          name: "Receivable 2"
          account_type: "asset_receivable"
          code: "REC2AR"
      - step: "Create the contra income account"
        action: "create"
        model: "account.account"
        save_as: "acc_income"
        values:
          name: "Income 2"
          account_type: "income"
          code: "REC2INC"
      - step: "Create and post the larger debit-side entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry1"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-03
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_ar.id"
                debit: 700.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 0.0
                credit: 700.0
      - step: "Post it"
        action: "call"
        target: "entry1"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Create and post the smaller credit-side entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry2"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-04
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_ar.id"
                debit: 0.0
                credit: 300.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 300.0
                credit: 0.0
      - step: "Post it"
        action: "call"
        target: "entry2"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Find the debit-side receivable line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry1.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "line1"
        limit: 1
      - step: "Find the credit-side receivable line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry2.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "line2"
        limit: 1
      - step: "Find both receivable lines as one recordset"
        action: "search"
        model: "journal_entry.item"
        domain: [["id", "in", ["REC: line1.id", "REC: line2.id"]]]
        save_as: "ar_lines"
        expect_count: 2
      - step: "Reconcile them"
        action: "call"
        target: "ar_lines"
        method: "reconcile"
        as_user: "base.user_admin"
      - step: "Assert the larger line keeps a 400.0 residual"
        action: "assert"
        target: "line1"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: false
          amount_residual:
            type: "value"
            expected: 400.0
      - step: "Assert the smaller line is fully consumed"
        action: "assert"
        target: "line2"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: true
          amount_residual:
            type: "value"
            expected: 0.0
      - step: "No reconcile_full was created (the graph is not fully matched)"
        action: "search"
        model: "reconcile_full"
        domain: [["reconciled_line_ids", "in", ["REC: line1.id", "REC: line2.id"]]]
        save_as: "no_full"
        expect_count: 0
      - step: "Both lines carry a 'P' matching number"
        action: "search"
        model: "journal_entry.item"
        domain:
          [
            ["id", "in", ["REC: line1.id", "REC: line2.id"]],
            ["matching_number", "like", "P%"],
          ]
        save_as: "p_lines"
        expect_count: 2

  - name: "Reconciling two debits against one credit leaves the correct residual"
    steps:
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Reconcile Journal 3"
          type: "general"
      - step: "Create a reconcilable (receivable) account"
        action: "create"
        model: "account.account"
        save_as: "acc_ar"
        values:
          name: "Receivable 3"
          account_type: "asset_receivable"
          code: "REC3AR"
      - step: "Create the contra income account"
        action: "create"
        model: "account.account"
        save_as: "acc_income"
        values:
          name: "Income 3"
          account_type: "income"
          code: "REC3INC"
      - step: "Create and post the first debit entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry_d1"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-05
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_ar.id"
                debit: 400.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 0.0
                credit: 400.0
      - step: "Post it"
        action: "call"
        target: "entry_d1"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Create and post the second debit entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry_d2"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-06
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_ar.id"
                debit: 300.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 0.0
                credit: 300.0
      - step: "Post it"
        action: "call"
        target: "entry_d2"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Create and post the single credit entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry_c1"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-07
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_ar.id"
                debit: 0.0
                credit: 1000.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 1000.0
                credit: 0.0
      - step: "Post it"
        action: "call"
        target: "entry_c1"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Find the first debit line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry_d1.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "line_d1"
        limit: 1
      - step: "Find the second debit line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry_d2.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "line_d2"
        limit: 1
      - step: "Find the credit line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry_c1.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "line_c1"
        limit: 1
      - step: "Find all three receivable lines as one recordset"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["id", "in", ["REC: line_d1.id", "REC: line_d2.id", "REC: line_c1.id"]]]
        save_as: "ar_lines"
        expect_count: 3
      - step: "Reconcile them"
        action: "call"
        target: "ar_lines"
        method: "reconcile"
        as_user: "base.user_admin"
      - step: "Assert the first debit line is fully consumed"
        action: "assert"
        target: "line_d1"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: true
          amount_residual:
            type: "value"
            expected: 0.0
      - step: "Assert the second debit line is fully consumed"
        action: "assert"
        target: "line_d2"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: true
          amount_residual:
            type: "value"
            expected: 0.0
      - step: "Assert the credit line keeps a -300.0 residual"
        action: "assert"
        target: "line_c1"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: false
          amount_residual:
            type: "value"
            expected: -300.0
      - step: "Two reconcile_partial rows were created"
        action: "search"
        model: "reconcile_partial"
        domain: [["credit_move_id", "=", "REC: line_c1.id"]]
        save_as: "credit_partials"
        expect_count: 2

  - name:
      "Removing a reconciliation restores the residual and clears the matching number"
    steps:
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Reconcile Journal 4"
          type: "general"
      - step: "Create a reconcilable (receivable) account"
        action: "create"
        model: "account.account"
        save_as: "acc_ar"
        values:
          name: "Receivable 4"
          account_type: "asset_receivable"
          code: "REC4AR"
      - step: "Create the contra income account"
        action: "create"
        model: "account.account"
        save_as: "acc_income"
        values:
          name: "Income 4"
          account_type: "income"
          code: "REC4INC"
      - step: "Create and post the debit-side entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry1"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-08
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_ar.id"
                debit: 600.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 0.0
                credit: 600.0
      - step: "Post it"
        action: "call"
        target: "entry1"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Create and post the credit-side entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry2"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-09
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_ar.id"
                debit: 0.0
                credit: 600.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 600.0
                credit: 0.0
      - step: "Post it"
        action: "call"
        target: "entry2"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Find the debit-side receivable line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry1.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "line1"
        limit: 1
      - step: "Find the credit-side receivable line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry2.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "line2"
        limit: 1
      - step: "Find both receivable lines as one recordset"
        action: "search"
        model: "journal_entry.item"
        domain: [["id", "in", ["REC: line1.id", "REC: line2.id"]]]
        save_as: "ar_lines"
        expect_count: 2
      - step: "Reconcile them"
        action: "call"
        target: "ar_lines"
        method: "reconcile"
        as_user: "base.user_admin"
      - step: "Sanity: both lines are reconciled"
        action: "assert"
        target: "line1"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: true
      - step: "Remove the reconciliation"
        action: "call"
        target: "ar_lines"
        method: "remove_move_reconcile"
        as_user: "base.user_admin"
      - step: "Assert the debit-side residual is restored"
        action: "assert"
        target: "line1"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: false
          amount_residual:
            type: "value"
            expected: 600.0
          matching_number:
            type: "value"
            operator: "is_falsy"
      - step: "Assert the credit-side residual is restored"
        action: "assert"
        target: "line2"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: false
          amount_residual:
            type: "value"
            expected: -600.0
          matching_number:
            type: "value"
            operator: "is_falsy"
      - step: "No reconcile_partial survives"
        action: "search"
        model: "reconcile_partial"
        domain:
          [
            ["debit_move_id", "=", "REC: line1.id"],
            ["credit_move_id", "=", "REC: line2.id"],
          ]
        save_as: "no_partial"
        expect_count: 0
      - step: "No reconcile_full survives"
        action: "search"
        model: "reconcile_full"
        domain: [["reconciled_line_ids", "in", ["REC: line1.id", "REC: line2.id"]]]
        save_as: "no_full_survives"
        expect_count: 0

  - name: "Enabling 'Allow Reconciliation' on an account fixes existing items' residual"
    steps:
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Reconcile Journal 5"
          type: "general"
      - step: "Create an account without reconciliation enabled"
        action: "create"
        model: "account.account"
        save_as: "acc_plain"
        values:
          name: "Plain Current Asset 5"
          account_type: "asset_current"
          code: "REC5AST"
          reconcile: false
      - step: "Create the contra income account"
        action: "create"
        model: "account.account"
        save_as: "acc_income"
        values:
          name: "Income 5"
          account_type: "income"
          code: "REC5INC"
      - step: "Create and post an entry on the non-reconcilable account"
        action: "create"
        model: "journal_entry"
        save_as: "entry1"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-10
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_plain.id"
                debit: 250.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 0.0
                credit: 250.0
      - step: "Post it"
        action: "call"
        target: "entry1"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Find its line on the plain account"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry1.id"], ["account_id", "=", "REC: acc_plain.id"]]
        save_as: "line1"
        limit: 1
      - step: "Before enabling reconciliation, residual is zero"
        action: "assert"
        target: "line1"
        refresh: true
        asserts:
          amount_residual:
            type: "value"
            expected: 0.0
      - step: "Enable 'Allow Reconciliation' on the account"
        action: "write"
        target: "acc_plain"
        as_user: "base.user_admin"
        values:
          reconcile: true
      - step: "The existing item's residual is now repaired"
        action: "assert"
        target: "line1"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: false
          amount_residual:
            type: "value"
            expected: 250.0

