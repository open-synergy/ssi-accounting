  - name:
      "Cancel-method reversal auto-reconciles the original and its reversal, both ending
      with zero residual"
    steps:
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Reconcile Journal 9"
          type: "general"
      - step: "Create a reconcilable (receivable) account"
        action: "create"
        model: "account.account"
        save_as: "acc_ar"
        values:
          name: "Receivable 9"
          account_type: "asset_receivable"
          code: "REC9AR"
      - step: "Create the contra income account"
        action: "create"
        model: "account.account"
        save_as: "acc_income"
        values:
          name: "Income 9"
          account_type: "income"
          code: "REC9INC"
      - step: "Create and post the original entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-17
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_ar.id"
                debit: 300.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 0.0
                credit: 300.0
      - step: "Post it"
        action: "call"
        target: "entry"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Create the reversal wizard, method 'cancel'"
        action: "create"
        model: "journal_entry_reversal"
        save_as: "wizard"
        values:
          move_ids:
            - - 6
              - 0
              - - "REC: entry.id"
          date: 2026-05-18
          refund_method: "cancel"
      - step: "Confirm the reversal"
        action: "call"
        target: "wizard"
        method: "action_reverse_moves"
        as_user: "base.user_admin"
      - step: "Find the reversal entry"
        action: "search"
        model: "journal_entry"
        domain: [["reversed_entry_id", "=", "REC: entry.id"]]
        save_as: "reversal"
        expect_count: 1
      - step: "Find the original entry's receivable line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "orig_line"
        limit: 1
      - step: "Find the reversal entry's receivable line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: reversal.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "rev_line"
        limit: 1
      - step: "Assert the original entry's line has zero residual"
        action: "assert"
        target: "orig_line"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: true
          amount_residual:
            type: "value"
            expected: 0.0
      - step: "Assert the reversal entry's line has zero residual"
        action: "assert"
        target: "rev_line"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: true
          amount_residual:
            type: "value"
            expected: 0.0
