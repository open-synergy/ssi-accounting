      - step: "Post it"
        action: "call"
        target: "entry_d2"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Create and post the single credit entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry_c1"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-07
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_ar.id"
                debit: 0.0
                credit: 1000.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 1000.0
                credit: 0.0
      - step: "Post it"
        action: "call"
        target: "entry_c1"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Find the first debit line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry_d1.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "line_d1"
        limit: 1
      - step: "Find the second debit line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry_d2.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "line_d2"
        limit: 1
      - step: "Find the credit line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry_c1.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "line_c1"
