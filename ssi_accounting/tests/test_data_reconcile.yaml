      - step: "Post it"
        action: "call"
        target: "entry_d1"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Create and post the second debit entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry_d2"
        values:
          journal_id: "REC: journal.id"
