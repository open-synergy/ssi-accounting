  - name: "Reconciling items from two different companies is rejected"
    steps:
      - step: "Create a journal in the default company"
        action: "create"
        model: "account.journal"
        save_as: "journal_a"
        values:
          name: "Reconcile Journal 7A"
          type: "general"
      - step: "Create a second company"
        action: "create"
        model: "res.company"
        save_as: "company_b"
        values:
          name: "Second Reconcile Company"
      - step: "Create a journal in the second company"
        action: "create"
        model: "account.journal"
