options:
  auto_refresh: true

scenarios:
  - name: "Two opposite lines on a reconcilable account fully match"
    steps:
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Reconcile Journal 1"
          type: "general"
      - step: "Create a reconcilable (receivable) account"
        action: "create"
        model: "account.account"
        save_as: "acc_ar"
        values:
          name: "Receivable 1"
          account_type: "asset_receivable"
          code: "REC1AR"
      - step: "Create the contra income account"
        action: "create"
        model: "account.account"
        save_as: "acc_income"
        values:
          name: "Income 1"
          account_type: "income"
          code: "REC1INC"
      - step: "Create and post the debit-side entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry1"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-01
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_ar.id"
                debit: 500.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 0.0
                credit: 500.0
      - step: "Post the debit-side entry"
        action: "call"
        target: "entry1"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Create and post the credit-side entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry2"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-02
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_ar.id"
                debit: 0.0
                credit: 500.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 500.0
                credit: 0.0
      - step: "Post the credit-side entry"
        action: "call"
        target: "entry2"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Find the debit-side receivable line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry1.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "line1"
        limit: 1
      - step: "Find the credit-side receivable line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry2.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "line2"
        limit: 1
      - step: "Find both receivable lines as one recordset"
        action: "search"
        model: "journal_entry.item"
        domain: [["id", "in", ["REC: line1.id", "REC: line2.id"]]]
        save_as: "ar_lines"
        expect_count: 2
      - step: "Reconcile them"
        action: "call"
        target: "ar_lines"
        method: "reconcile"
        as_user: "base.user_admin"
      - step: "Assert the debit-side line is fully reconciled"
        action: "assert"
        target: "line1"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: true
          amount_residual:
            type: "value"
            expected: 0.0
      - step: "Assert the credit-side line is fully reconciled"
        action: "assert"
        target: "line2"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: true
          amount_residual:
            type: "value"
            expected: 0.0
      - step: "Exactly one reconcile_partial was created"
        action: "search"
        model: "reconcile_partial"
        domain:
          [
            ["debit_move_id", "=", "REC: line1.id"],
            ["credit_move_id", "=", "REC: line2.id"],
          ]
        save_as: "partial"
        expect_count: 1
      - step: "Assert the partial's amount"
        action: "assert"
        target: "partial"
        asserts:
          amount:
            type: "value"
            expected: 500.0
      - step: "Exactly one reconcile_full was created"
        action: "search"
        model: "reconcile_full"
        domain: [["reconciled_line_ids", "in", ["REC: line1.id", "REC: line2.id"]]]
        expect_count: 1
      - step: "Neither line keeps a partial-style 'P' matching number"
        action: "search"
        model: "journal_entry.item"
        domain:
          [
            ["id", "in", ["REC: line1.id", "REC: line2.id"]],
            ["matching_number", "like", "P%"],
          ]
        expect_count: 0

  - name: "Partial reconciliation leaves a residual and a 'P' matching number"
    steps:
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Reconcile Journal 2"
          type: "general"
      - step: "Create a reconcilable (receivable) account"
        action: "create"
        model: "account.account"
        save_as: "acc_ar"
        values:
          name: "Receivable 2"
          account_type: "asset_receivable"
          code: "REC2AR"
      - step: "Create the contra income account"
        action: "create"
        model: "account.account"
        save_as: "acc_income"
        values:
          name: "Income 2"
          account_type: "income"
          code: "REC2INC"
      - step: "Create and post the larger debit-side entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry1"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-03
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_ar.id"
                debit: 700.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 0.0
                credit: 700.0
      - step: "Post it"
        action: "call"
        target: "entry1"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Create and post the smaller credit-side entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry2"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-04
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_ar.id"
                debit: 0.0
                credit: 300.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 300.0
                credit: 0.0
      - step: "Post it"
        action: "call"
        target: "entry2"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Find the debit-side receivable line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry1.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "line1"
        limit: 1
      - step: "Find the credit-side receivable line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry2.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "line2"
        limit: 1
      - step: "Find both receivable lines as one recordset"
        action: "search"
        model: "journal_entry.item"
        domain: [["id", "in", ["REC: line1.id", "REC: line2.id"]]]
        save_as: "ar_lines"
        expect_count: 2
      - step: "Reconcile them"
        action: "call"
        target: "ar_lines"
        method: "reconcile"
        as_user: "base.user_admin"
      - step: "Assert the larger line keeps a 400.0 residual"
        action: "assert"
        target: "line1"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: false
          amount_residual:
            type: "value"
            expected: 400.0
      - step: "Assert the smaller line is fully consumed"
        action: "assert"
        target: "line2"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: true
          amount_residual:
            type: "value"
            expected: 0.0
      - step: "No reconcile_full was created (the graph is not fully matched)"
        action: "search"
        model: "reconcile_full"
        domain: [["reconciled_line_ids", "in", ["REC: line1.id", "REC: line2.id"]]]
        expect_count: 0
      - step: "Both lines carry a 'P' matching number"
        action: "search"
        model: "journal_entry.item"
        domain:
          [
            ["id", "in", ["REC: line1.id", "REC: line2.id"]],
            ["matching_number", "like", "P%"],
          ]
        expect_count: 2

  - name: "Reconciling two debits against one credit leaves the correct residual"
