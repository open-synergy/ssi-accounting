        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: false
          amount_residual:
            type: "value"
            expected: -300.0
      - step: "Two reconcile_partial rows were created"
        action: "search"
        model: "reconcile_partial"
        domain: [["credit_move_id", "=", "REC: line_c1.id"]]
        expect_count: 2

  - name:
      "Removing a reconciliation restores the residual and clears the matching number"
    steps:
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Reconcile Journal 4"
          type: "general"
      - step: "Create a reconcilable (receivable) account"
        action: "create"
        model: "account.account"
        save_as: "acc_ar"
        values:
          name: "Receivable 4"
          account_type: "asset_receivable"
          code: "REC4AR"
      - step: "Create the contra income account"
        action: "create"
        model: "account.account"
        save_as: "acc_income"
        values:
          name: "Income 4"
          account_type: "income"
          code: "REC4INC"
      - step: "Create and post the debit-side entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry1"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-08
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_ar.id"
                debit: 600.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 0.0
                credit: 600.0
      - step: "Post it"
        action: "call"
        target: "entry1"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Create and post the credit-side entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry2"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-09
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_ar.id"
                debit: 0.0
                credit: 600.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 600.0
                credit: 0.0
      - step: "Post it"
        action: "call"
        target: "entry2"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Find the debit-side receivable line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry1.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "line1"
        limit: 1
      - step: "Find the credit-side receivable line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry2.id"], ["account_id", "=", "REC: acc_ar.id"]]
        save_as: "line2"
        limit: 1
      - step: "Find both receivable lines as one recordset"
        action: "search"
        model: "journal_entry.item"
        domain: [["id", "in", ["REC: line1.id", "REC: line2.id"]]]
        save_as: "ar_lines"
        expect_count: 2
      - step: "Reconcile them"
        action: "call"
        target: "ar_lines"
        method: "reconcile"
        as_user: "base.user_admin"
      - step: "Sanity: both lines are reconciled"
        action: "assert"
        target: "line1"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: true
      - step: "Remove the reconciliation"
        action: "call"
        target: "ar_lines"
        method: "remove_move_reconcile"
        as_user: "base.user_admin"
      - step: "Assert the debit-side residual is restored"
        action: "assert"
        target: "line1"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: false
          amount_residual:
            type: "value"
            expected: 600.0
          matching_number:
            type: "value"
            operator: "is_falsy"
      - step: "Assert the credit-side residual is restored"
        action: "assert"
        target: "line2"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: false
          amount_residual:
            type: "value"
            expected: -600.0
          matching_number:
            type: "value"
            operator: "is_falsy"
      - step: "No reconcile_partial survives"
        action: "search"
        model: "reconcile_partial"
        domain:
          [
            ["debit_move_id", "=", "REC: line1.id"],
            ["credit_move_id", "=", "REC: line2.id"],
          ]
        expect_count: 0
      - step: "No reconcile_full survives"
        action: "search"
        model: "reconcile_full"
        domain: [["reconciled_line_ids", "in", ["REC: line1.id", "REC: line2.id"]]]
        expect_count: 0

  - name: "Enabling 'Allow Reconciliation' on an account fixes existing items' residual"
    steps:
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Reconcile Journal 5"
          type: "general"
      - step: "Create an account without reconciliation enabled"
        action: "create"
        model: "account.account"
        save_as: "acc_plain"
        values:
          name: "Plain Current Asset 5"
          account_type: "asset_current"
          code: "REC5AST"
          reconcile: false
      - step: "Create the contra income account"
        action: "create"
        model: "account.account"
        save_as: "acc_income"
        values:
          name: "Income 5"
          account_type: "income"
          code: "REC5INC"
      - step: "Create and post an entry on the non-reconcilable account"
        action: "create"
        model: "journal_entry"
        save_as: "entry1"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-10
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_plain.id"
                debit: 250.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: acc_income.id"
                debit: 0.0
                credit: 250.0
      - step: "Post it"
        action: "call"
        target: "entry1"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Find its line on the plain account"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry1.id"], ["account_id", "=", "REC: acc_plain.id"]]
        save_as: "line1"
        limit: 1
      - step: "Before enabling reconciliation, residual is zero"
        action: "assert"
        target: "line1"
        refresh: true
        asserts:
          amount_residual:
            type: "value"
            expected: 0.0
      - step: "Enable 'Allow Reconciliation' on the account"
        action: "write"
        target: "acc_plain"
        as_user: "base.user_admin"
        values:
          reconcile: true
      - step: "The existing item's residual is now repaired"
        action: "assert"
        target: "line1"
        refresh: true
        asserts:
          reconciled:
            type: "value"
            expected: false
          amount_residual:
            type: "value"
            expected: 250.0

