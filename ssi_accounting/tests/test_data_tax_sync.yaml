  - name: "A tax group with two children creates one tax line per child"
    steps:
      - step: "Create a tax group"
        action: "create"
        model: "tax_group"
        save_as: "vat_group"
        values:
          name: "VAT Group 4"
      - step: "Create child tax A (5%)"
        action: "create"
        model: "tax"
        save_as: "child_a"
        values:
          name: "Child A 5% (Sync 4)"
          amount_type: "percent"
          amount: 5.0
          tax_group_id: "REC: vat_group.id"
      - step: "Create child tax B (6%)"
        action: "create"
        model: "tax"
        save_as: "child_b"
        values:
          name: "Child B 6% (Sync 4)"
          amount_type: "percent"
          amount: 6.0
          tax_group_id: "REC: vat_group.id"
      - step: "Create the group of taxes"
        action: "create"
        model: "tax"
        save_as: "group_tax"
        values:
          name: "Group AB (Sync 4)"
          amount_type: "group"
          tax_group_id: "REC: vat_group.id"
          children_tax_ids:
            - - 6
              - 0
              - - "REC: child_a.id"
                - "REC: child_b.id"
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Tax Sync Journal 4"
          type: "general"
      - step: "Create the expense account"
        action: "create"
        model: "account.account"
        save_as: "acc_expense"
        values:
          name: "Expense Account 4"
          account_type: "expense"
          code: "TS4001"
      - step: "Create the payable account"
        action: "create"
        model: "account.account"
        save_as: "acc_payable"
        values:
          name: "Payable Account 4"
          account_type: "liability_current"
          code: "TS4002"
      - step: "Create an entry taxed with the group of taxes"
        action: "create"
        model: "journal_entry"
        save_as: "entry"
        values:
          journal_id: "REC: journal.id"
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_expense.id"
                balance: 200000.0
                tax_ids:
                  - - 6
                    - 0
                    - - "REC: group_tax.id"
            - - 0
              - 0
              - account_id: "REC: acc_payable.id"
                balance: -222000.0
      - step: "Find the generated tax lines"
        action: "search"
        model: "journal_entry.item"
        domain: [["move_id", "=", "REC: entry.id"], ["display_type", "=", "tax"]]
        save_as: "tax_lines"
        expect_count: 2
      - step: "Find child A's tax line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry.id"], ["tax_line_id", "=", "REC: child_a.id"]]
        save_as: "tax_line_a"
        limit: 1
      - step: "Find child B's tax line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [["move_id", "=", "REC: entry.id"], ["tax_line_id", "=", "REC: child_b.id"]]
        save_as: "tax_line_b"
        limit: 1
      - step: "Assert each child's amount and the group backlink"
        action: "assert"
        target: "tax_line_a"
        asserts:
          balance:
            type: "value"
            expected: 10000.0
          group_tax_id:
            type: "m2o"
            expected: "REC: group_tax"
      - step: "Assert child B's amount and the group backlink"
        action: "assert"
        target: "tax_line_b"
        asserts:
          balance:
            type: "value"
            expected: 12000.0
          group_tax_id:
            type: "m2o"
            expected: "REC: group_tax"

