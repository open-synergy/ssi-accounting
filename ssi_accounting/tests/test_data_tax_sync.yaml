                tax_ids:
                  - - 6
                    - 0
                    - - "REC: vat11.id"
            - - 0
              - 0
              - account_id: "REC: acc_payable.id"
                balance: -1110000.0
      - step: "Find the debit (base) line"
        action: "search"
        model: "journal_entry.item"
        domain:
