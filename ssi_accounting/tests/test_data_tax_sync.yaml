options:
  auto_refresh: true

scenarios:
  - name: "Applying an 11% tax to a debit line creates a matching tax line"
    steps:
      - step: "Create a tax group"
        action: "create"
        model: "tax_group"
        save_as: "vat_group"
        values:
          name: "VAT Group 1"
      - step: "Create the VAT payable account"
        action: "create"
        model: "account.account"
        save_as: "vat_account"
        values:
          name: "VAT Payable 1"
          account_type: "liability_current"
          code: "TS1001"
      - step: "Create a tax grid tag"
        action: "create"
        model: "account.tag"
        save_as: "vat_tag"
        values:
          name: "+VAT 1"
          applicability: "taxes"
      - step: "Create VAT 11% with an explicit repartition account/tag"
        action: "create"
        model: "tax"
        save_as: "vat11"
        values:
          name: "VAT 11% (Sync 1)"
          amount_type: "percent"
          amount: 11.0
          tax_group_id: "REC: vat_group.id"
          repartition_line_base_ids:
            - - 0
              - 0
              - document_type: "base"
                repartition_type: "base"
            - - 0
              - 0
              - document_type: "base"
                repartition_type: "tax"
                account_id: "REC: vat_account.id"
                tag_ids:
                  - - 6
                    - 0
                    - - "REC: vat_tag.id"
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Tax Sync Journal 1"
          type: "general"
      - step: "Create the expense account"
        action: "create"
        model: "account.account"
        save_as: "acc_expense"
        values:
          name: "Expense Account 1"
          account_type: "expense"
          code: "TS1002"
      - step: "Create the payable account"
        action: "create"
        model: "account.account"
        save_as: "acc_payable"
        values:
          name: "Payable Account 1"
          account_type: "liability_current"
          code: "TS1003"
      - step: "Create an entry with a taxed debit line"
        action: "create"
        model: "journal_entry"
        save_as: "entry"
        values:
          journal_id: "REC: journal.id"
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_expense.id"
                balance: 1000000.0
                tax_ids:
                  - - 6
                    - 0
                    - - "REC: vat11.id"
            - - 0
              - 0
              - account_id: "REC: acc_payable.id"
                balance: -1110000.0
      - step: "Find the generated tax line"
        action: "search"
        model: "journal_entry.item"
        domain: [["move_id", "=", "REC: entry.id"], ["display_type", "=", "tax"]]
        save_as: "tax_line"
        expect_count: 1
      - step: "Assert the tax line's amount, account and tags"
        action: "assert"
        target: "tax_line"
        asserts:
          balance:
            type: "value"
            expected: 110000.0
          amount_currency:
            type: "value"
            expected: 110000.0
          account_id:
            type: "m2o"
            expected: "REC: vat_account"
          tax_tag_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: vat_tag"
          tax_base_amount:
            type: "value"
            expected: 1000000.0

  - name: "Changing the base line amount resynchronises the tax line"
    steps:
      - step: "Create a tax group"
        action: "create"
        model: "tax_group"
        save_as: "vat_group"
        values:
          name: "VAT Group 2"
      - step: "Create VAT 11%"
        action: "create"
        model: "tax"
        save_as: "vat11"
        values:
          name: "VAT 11% (Sync 2)"
          amount_type: "percent"
          amount: 11.0
          tax_group_id: "REC: vat_group.id"
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Tax Sync Journal 2"
          type: "general"
      - step: "Create the expense account"
        action: "create"
        model: "account.account"
        save_as: "acc_expense"
        values:
          name: "Expense Account 2"
          account_type: "expense"
          code: "TS2001"
      - step: "Create the payable account"
        action: "create"
        model: "account.account"
        save_as: "acc_payable"
        values:
          name: "Payable Account 2"
          account_type: "liability_current"
          code: "TS2002"
      - step: "Create an entry with a taxed debit line"
        action: "create"
        model: "journal_entry"
        save_as: "entry"
        values:
          journal_id: "REC: journal.id"
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_expense.id"
                balance: 1000000.0
                tax_ids:
                  - - 6
                    - 0
                    - - "REC: vat11.id"
            - - 0
              - 0
              - account_id: "REC: acc_payable.id"
                balance: -1110000.0
      - step: "Find the debit (base) line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [
            ["move_id", "=", "REC: entry.id"],
            ["account_id", "=", "REC: acc_expense.id"],
          ]
        save_as: "base_line"
        limit: 1
      - step: "Find the payable (credit) line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [
            ["move_id", "=", "REC: entry.id"],
            ["account_id", "=", "REC: acc_payable.id"],
          ]
        save_as: "credit_line"
        limit: 1
      - step: "Double the base amount and rebalance the credit line"
        action: "write"
        target: "entry"
        values:
          line_ids:
            - - 1
              - "REC: base_line.id"
              - balance: 2000000.0
            - - 1
              - "REC: credit_line.id"
              - balance: -2220000.0
      - step: "Find the resynced tax line"
        action: "search"
        model: "journal_entry.item"
        domain: [["move_id", "=", "REC: entry.id"], ["display_type", "=", "tax"]]
        save_as: "tax_line"
        expect_count: 1
      - step: "Assert the tax line follows the new base"
        action: "assert"
        target: "tax_line"
        asserts:
          balance:
            type: "value"
            expected: 220000.0
          tax_base_amount:
            type: "value"
            expected: 2000000.0

