                balance: 1000.0
                tax_ids:
                  - - 6
                    - 0
                    - - "REC: tax_included.id"
            - - 0
              - 0
              - account_id: "REC: acc_payable.id"
                balance: -1100.0
      - step: "Find the tax line"
        action: "search"
        model: "journal_entry.item"
        domain: [["move_id", "=", "REC: entry.id"], ["display_type", "=", "tax"]]
        save_as: "tax_line"
        limit: 1
      - step:
          "Assert the tax is 10% ON TOP of 1000 (100), not extracted FROM it (~90.91)"
        action: "assert"
        target: "tax_line"
        asserts:
          balance:
            type: "value"
            expected: 100.0
          tax_base_amount:
            type: "value"
            expected: 1000.0

