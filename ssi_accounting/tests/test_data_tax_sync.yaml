  - name: "include_base_amount raises the subsequent tax's base"
    steps:
      - step: "Create a tax group"
        action: "create"
        model: "tax_group"
        save_as: "vat_group"
        values:
          name: "VAT Group 6"
      - step: "Create the base-raising fixed surcharge"
        action: "create"
        model: "tax"
        save_as: "tax_surcharge"
        values:
          name: "Fixed Surcharge (Sync 6)"
          amount_type: "fixed"
          amount: 10.0
          sequence: 1
          include_base_amount: true
          tax_group_id: "REC: vat_group.id"
      - step: "Create the 10% tax affected by the surcharge's base"
        action: "create"
        model: "tax"
        save_as: "tax_percent"
        values:
          name: "VAT 10% (Sync 6)"
          amount_type: "percent"
          amount: 10.0
          sequence: 2
          tax_group_id: "REC: vat_group.id"
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Tax Sync Journal 6"
          type: "general"
      - step: "Create the expense account"
        action: "create"
        model: "account.account"
        save_as: "acc_expense"
        values:
          name: "Expense Account 6"
          account_type: "expense"
          code: "TS6001"
      - step: "Create the payable account"
        action: "create"
        model: "account.account"
        save_as: "acc_payable"
        values:
          name: "Payable Account 6"
          account_type: "liability_current"
          code: "TS6002"
      - step: "Create an entry taxed with both cascading taxes"
        action: "create"
        model: "journal_entry"
        save_as: "entry"
        values:
          journal_id: "REC: journal.id"
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_expense.id"
                balance: 100.0
                tax_ids:
                  - - 6
                    - 0
                    - - "REC: tax_surcharge.id"
                      - "REC: tax_percent.id"
            - - 0
              - 0
              - account_id: "REC: acc_payable.id"
                balance: -121.0
      - step: "Find the surcharge's tax line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [
            ["move_id", "=", "REC: entry.id"],
            ["tax_line_id", "=", "REC: tax_surcharge.id"],
          ]
        save_as: "surcharge_line"
        limit: 1
      - step: "Find the percent tax's line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [
            ["move_id", "=", "REC: entry.id"],
            ["tax_line_id", "=", "REC: tax_percent.id"],
          ]
        save_as: "percent_line"
        limit: 1
      - step: "Assert the surcharge stayed a flat 10"
        action: "assert"
        target: "surcharge_line"
        asserts:
          balance:
            type: "value"
            expected: 10.0
      - step: "Assert the percent tax was computed on the raised base (110), not 100"
        action: "assert"
        target: "percent_line"
        asserts:
          balance:
            type: "value"
            expected: 11.0
          tax_base_amount:
            type: "value"
            expected: 110.0

