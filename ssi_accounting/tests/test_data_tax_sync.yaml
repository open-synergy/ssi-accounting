                balance: -1110000.0
      - step: "Find the generated tax line"
        action: "search"
        model: "journal_entry.item"
        domain: [["move_id", "=", "REC: entry.id"], ["display_type", "=", "tax"]]
        save_as: "tax_line"
        limit: 1
      - step: "Find the payable (credit) line"
        action: "search"
        model: "journal_entry.item"
        domain:
          [
            ["move_id", "=", "REC: entry.id"],
            ["account_id", "=", "REC: acc_payable.id"],
          ]
        save_as: "credit_line"
        limit: 1
      - step: "Manually override the tax line's amount, rebalancing the credit line"
        action: "write"
        target: "entry"
        values:
          line_ids:
            - - 1
              - "REC: tax_line.id"
              - balance: 150000.0
                amount_currency: 150000.0
            - - 1
              - "REC: credit_line.id"
              - balance: -1150000.0
      - step: "Write an unrelated header field, forcing another sync pass"
        action: "write"
        target: "entry"
        values:
          ref: "Updated Ref"
      - step: "Assert the manual tax amount was not overwritten"
        action: "assert"
        target: "tax_line"
        asserts:
          balance:
            type: "value"
            expected: 150000.0

  - name: "An unbalanced tax-affected entry is rejected with an SSI-formatted error"
    steps:
      - step: "Create a tax group"
        action: "create"
        model: "tax_group"
        save_as: "vat_group"
        values:
          name: "VAT Group 9"
      - step: "Create VAT 11%"
        action: "create"
        model: "tax"
        save_as: "vat11"
        values:
          name: "VAT 11% (Sync 9)"
          amount_type: "percent"
          amount: 11.0
          tax_group_id: "REC: vat_group.id"
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Tax Sync Journal 9"
          type: "general"
      - step: "Create the expense account"
        action: "create"
        model: "account.account"
        save_as: "acc_expense"
        values:
          name: "Expense Account 9"
          account_type: "expense"
          code: "TS9001"
      - step: "Create the payable account"
        action: "create"
        model: "account.account"
        save_as: "acc_payable"
        values:
          name: "Payable Account 9"
          account_type: "liability_current"
          code: "TS9002"
      - step: "Creating a taxed entry without room for the tax amount is rejected"
        action: "create"
        model: "journal_entry"
        expect_error:
          type: "UserError"
          message_contains: "Context: Save journal entry"
        values:
          journal_id: "REC: journal.id"
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_expense.id"
                balance: 1000000.0
                tax_ids:
                  - - 6
                    - 0
                    - - "REC: vat11.id"
            - - 0
              - 0
              - account_id: "REC: acc_payable.id"
                balance: -1000000.0

  - name:
      "A tax whose repartition line's account belongs to another company is rejected"
    steps:
      - step: "Create a tax group"
        action: "create"
        model: "tax_group"
        save_as: "vat_group"
        values:
          name: "VAT Group 10"
      - step: "Create a second company"
        action: "create"
        model: "res.company"
        save_as: "company_b"
        values:
          name: "Second Tax Sync Company"
      - step: "Create an account belonging only to the second company"
        action: "create"
        model: "account.account"
        save_as: "foreign_account"
        context:
          allowed_company_ids: ["REC: company_b.id"]
        values:
          name: "Foreign VAT Account"
          code: "TS10FOREIGN"
          account_type: "liability_current"
          company_ids: [[6, 0, ["REC: company_b.id"]]]
      - step:
          "Creating a tax repartition line whose account posts cross-company is rejected"
        action: "create"
        model: "tax"
        expect_error:
          type: "UserError"
        values:
          name: "VAT 11% (Sync 10)"
          amount_type: "percent"
          amount: 11.0
          tax_group_id: "REC: vat_group.id"
          repartition_line_base_ids:
            - - 0
              - 0
              - document_type: "base"
                repartition_type: "base"
            - - 0
              - 0
              - document_type: "base"
                repartition_type: "tax"
                account_id: "REC: foreign_account.id"
