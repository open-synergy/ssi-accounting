                debit: 50.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: acc_b.id"
                debit: 0.0
                credit: 50.0
      - step: "Find one of the journal items just created"
        action: "search"
        model: "journal_entry.item"
        domain: [["move_id", "=", "REC: entry.id"]]
        save_as: "item"
        limit: 1
      - step: "Get list view id"
