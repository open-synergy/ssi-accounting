  - name: "Load all views for the Journal Entries action"
    steps:
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "View Smoke Entry Journal"
          type: "general"
      - step: "Create the debit-side account"
        action: "create"
        model: "account.account"
        save_as: "acc_a"
        values:
          name: "View Smoke Debit Account"
          account_type: "asset_current"
          code: "VS0002"
      - step: "Create the credit-side account"
        action: "create"
        model: "account.account"
        save_as: "acc_b"
        values:
          name: "View Smoke Credit Account"
          account_type: "income"
          code: "VS0003"
      - step: "Create a draft journal entry with one balanced line pair"
        action: "create"
        model: "journal_entry"
        save_as: "entry"
        values:
          journal_id: "REC: journal.id"
          date: 2026-03-10
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_a.id"
                debit: 50.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: acc_b.id"
                debit: 0.0
                credit: 50.0
      - step: "Get list view id"
        action: "ref"
        xml_id: "ssi_accounting.journal_entry_view_list"
        save_as: "v_list"
      - step: "Get form view id"
        action: "ref"
        xml_id: "ssi_accounting.journal_entry_view_form"
        save_as: "v_form"
