scenarios:
  - name: "Load all views for the Chart of Accounts action"
    steps:
      - step: "Create an account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "View Smoke Account"
          account_type: "asset_current"
          code: "VS0001"
      - step: "Get list view id"
        action: "ref"
        xml_id: "ssi_accounting.account_view_list"
        save_as: "v_list"
      - step: "Get form view id"
        action: "ref"
        xml_id: "ssi_accounting.account_view_form"
        save_as: "v_form"
      - step: "Get search view id"
        action: "ref"
        xml_id: "ssi_accounting.account_view_search"
        save_as: "v_search"
      - step: "Load list, form, and search views without error"
        action: "call"
        target: "account"
        method: "get_views"
        kwargs:
          views:
            - ["REC: v_list.id", "list"]
            - ["REC: v_form.id", "form"]
            - ["REC: v_search.id", "search"]

