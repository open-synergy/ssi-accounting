        save_as: "acc_b"
        values:
          name: "Posting Account 6B"
          account_type: "income"
          code: "JEP6B"
      - step: "Create a draft entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry_draft"
        values:
          journal_id: "REC: journal.id"
          date: 2026-05-01
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_a.id"
                debit: 5.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: acc_b.id"
