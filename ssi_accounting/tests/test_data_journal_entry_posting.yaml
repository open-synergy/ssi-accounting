        values:
          journal_id: "REC: journal.id"
          date: 2026-05-02
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_a.id"
                debit: 7.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: acc_b.id"
                debit: 0.0
                credit: 7.0
      - step: "Post the second entry"
        action: "call"
        target: "entry_posted"
        method: "action_post"
        as_user: "base.user_admin"
      - step: "Cancel the posted entry"
        action: "call"
        target: "entry_posted"
        method: "button_cancel"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "cancel"

  - name: "Posting an entry with no lines is rejected"
    steps:
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Posting Journal 8"
          type: "general"
      - step: "Create a lineless draft entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry"
        values:
          journal_id: "REC: journal.id"
          date: 2026-03-01
      - step: "Posting it is rejected"
        action: "call"
        target: "entry"
        method: "action_post"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "no postable line"

  - name: "Posting to an archived journal is rejected"
    steps:
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Posting Journal 9"
          type: "general"
      - step: "Create the debit-side account"
        action: "create"
        model: "account.account"
        save_as: "acc_a"
        values:
          name: "Posting Account 9A"
          account_type: "asset_current"
          code: "JEP9A"
      - step: "Create the credit-side account"
        action: "create"
        model: "account.account"
        save_as: "acc_b"
        values:
          name: "Posting Account 9B"
          account_type: "income"
          code: "JEP9B"
      - step: "Create a draft entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry"
        values:
          journal_id: "REC: journal.id"
          date: 2026-03-05
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_a.id"
                debit: 12.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: acc_b.id"
                debit: 0.0
                credit: 12.0
      - step: "Archive the journal"
        action: "write"
        target: "journal"
        values:
          active: false
      - step: "Posting to it is rejected"
        action: "call"
        target: "entry"
        method: "action_post"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "archived journal"

  - name: "Posting without the accounting user group is rejected"
    steps:
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Posting Journal 10"
          type: "general"
      - step: "Create the debit-side account"
        action: "create"
        model: "account.account"
        save_as: "acc_a"
        values:
          name: "Posting Account 10A"
          account_type: "asset_current"
          code: "JEP10A"
      - step: "Create the credit-side account"
        action: "create"
        model: "account.account"
        save_as: "acc_b"
        values:
          name: "Posting Account 10B"
          account_type: "income"
          code: "JEP10B"
      - step: "Create a draft entry"
        action: "create"
        model: "journal_entry"
        save_as: "entry"
        values:
          journal_id: "REC: journal.id"
          date: 2026-03-06
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_a.id"
                debit: 8.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: acc_b.id"
                debit: 0.0
                credit: 8.0
      - step: "Create a user without the accounting group"
        action: "create"
        model: "res.users"
        save_as: "outsider"
        values:
          name: "Posting Outsider"
          login: "posting_outsider@example.com"
          group_ids: "RECORDSET: base.group_user"
      - step: "Posting as that user is rejected with an access error"
        action: "call"
        target: "entry"
        method: "action_post"
        as_user: "outsider"
        expect_error:
          type: "AccessError"

  # Kept as the LAST scenario on purpose: it locks 'company' (the shared
  # 'env.company' alias, not scenario-local) and scenario writes are not
  # rolled back between scenarios within one test method (only once the
  # whole method finishes) -- see odoo-development-unit-test's
  # framework-and-structure.md. Every earlier scenario above posts
  # entries dated well after 2026-01-31, so this ordering is safe.
  - name: "Posting inside a locked fiscal period shifts the entry's date"
    steps:
      - step: "Create a journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Posting Journal 11"
          type: "general"
      - step: "Create the debit-side account"
        action: "create"
        model: "account.account"
        save_as: "acc_a"
        values:
          name: "Posting Account 11A"
          account_type: "asset_current"
          code: "JEP11A"
      - step: "Create the credit-side account"
        action: "create"
        model: "account.account"
        save_as: "acc_b"
        values:
          name: "Posting Account 11B"
          account_type: "income"
          code: "JEP11B"
      - step: "Lock the fiscal year up to 2026-01-31"
        action: "write"
        target: "company"
        values:
          fiscalyear_lock_date: 2026-01-31
      - step: "Create an entry dated inside the locked period"
        action: "create"
        model: "journal_entry"
        save_as: "entry"
        values:
          journal_id: "REC: journal.id"
          date: 2026-01-15
          line_ids:
            - - 0
              - 0
              - account_id: "REC: acc_a.id"
                debit: 25.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: acc_b.id"
                debit: 0.0
                credit: 25.0
      - step: "Post it"
        action: "call"
        target: "entry"
        method: "action_post"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "posted"
      - step: "Assert the date was pushed past the lock date"
        action: "assert"
        target: "entry"
        asserts:
          date:
            type: "value"
            operator: "gt"
            expected: 2026-01-31
