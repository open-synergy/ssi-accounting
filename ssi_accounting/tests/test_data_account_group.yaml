scenarios:
  - name: "Create a two-level account group hierarchy with prefix auto-fill"
    steps:
      - step: "Create root group with only a starting prefix"
        action: "create"
        model: "account.group"
        save_as: "parent_group"
        values:
          name: "Assets"
          code_prefix_start: "1"
      - step: "code_prefix_end is auto-filled from code_prefix_start"
        action: "assert"
        target: "parent_group"
        asserts:
          code_prefix_end:
            type: "value"
            expected: "1"
      - step: "Create a narrower child group nested under the root group"
        action: "create"
        model: "account.group"
        save_as: "child_group"
        values:
          name: "Current Assets"
          code_prefix_start: "10"
          code_prefix_end: "19"
      - step: "Child group's parent is auto-assigned to the root group"
        action: "assert"
        target: "child_group"
        asserts:
          parent_id:
            type: "m2o"
            expected: "REC: parent_group"
      - step: "Materialized hierarchy path is populated"
        action: "assert"
        target: "child_group"
        asserts:
          parent_path:
            type: "value"
            operator: "is_truthy"

  - name: "Overlapping prefix range of the same length is rejected"
    steps:
      - step: "Create first group covering 50-59"
        action: "create"
        model: "account.group"
        save_as: "group_c"
        values:
          name: "Group C"
          code_prefix_start: "50"
          code_prefix_end: "59"
      - step: "Second group overlapping 55-59 is rejected"
        action: "create"
        model: "account.group"
        expect_error:
          type: "ValidationError"
          message_contains: "overlap"
        values:
          name: "Group D"
          code_prefix_start: "55"
          code_prefix_end: "65"

  - name: "Mismatched prefix length is rejected with an SSI-formatted error"
    steps:
      - step: "Starting prefix longer than ending prefix is rejected"
        action: "create"
        model: "account.group"
        expect_error:
          type: "ValidationError"
          message_contains: "length"
        values:
          name: "Group E"
          code_prefix_start: "100"
          code_prefix_end: "19"

  - name: "Deleting an account group re-parents its accounts and child groups"
    steps:
      - step: "Create root group covering 7"
        action: "create"
        model: "account.group"
        save_as: "root_group"
        values:
          name: "Group Root G7"
          code_prefix_start: "7"
      - step: "Create a narrower child group nested under the root group"
        action: "create"
        model: "account.group"
        save_as: "child_group"
        values:
          name: "Group Child G70-79"
          code_prefix_start: "70"
          code_prefix_end: "79"
      - step: "Create an account matching the child group's prefix"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "Account Under Child Group"
          account_type: "asset_current"
          code: "705000"
      - step: "Account is auto-assigned to the (more specific) child group"
        action: "assert"
        target: "account"
        asserts:
          group_id:
            type: "m2o"
            expected: "REC: child_group"
      - step: "Delete the child group"
        action: "unlink"
        target: "child_group"
      - step: "The account is re-parented to the deleted group's own parent"
        action: "assert"
        target: "account"
        asserts:
          group_id:
            type: "m2o"
            expected: "REC: root_group"
      - step: "Verify the child group is actually gone"
        action: "search"
        model: "account.group"
        domain: [["name", "=", "Group Child G70-79"]]
        save_as: "result"
        expect_count: 0
